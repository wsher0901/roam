<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 1160" width="740" height="1160" font-family="sans-serif" role="img" aria-label="Away and return — the chooser, the flight, the four endings, and the resume, drawn as swimlanes across you, the ground seat, the cockpit and origin.">
