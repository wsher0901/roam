  <text x="28" y="36" font-size="17" font-weight="600" fill="#3D3D3A">Away &amp; return</text>
  <text x="28" y="55" font-size="11" fill="#8A887F">The chooser decides how a sitting ends — sessions are cattle, branches are the work.</text>

