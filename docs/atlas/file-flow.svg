<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 540" width="740" height="540" font-family="sans-serif" role="img" aria-label="The file flow — what a sitting reads at start, and which ritual writes each surface, drawn with one lane per store.">
  <defs>
    <marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#8A887F"/>
    </marker>
    <marker id="tipd" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#B3B0A5"/>
    </marker>
  </defs>

  <rect class="panel" x="0.5" y="0.5" width="739" height="539" rx="16" fill="#FAF9F5" stroke="#E5E2D9"/>

  <text x="28" y="36" font-size="17" font-weight="600" fill="#3D3D3A">The file flow</text>
  <text x="28" y="55" font-size="11" fill="#8A887F">What a sitting reads at start (1–4), and who writes each surface (5–12) — one home per class.</text>

  <text x="28" y="88" font-size="9" font-weight="600" letter-spacing="0.8" fill="#B3B0A5">SESSION START READS — IN ORDER</text>

  <g class="card">
    <rect x="24" y="98" width="161" height="56" rx="10" fill="#FFFFFF" stroke="#E5E2D9"/>
    <circle cx="39" cy="113" r="8.5" fill="#F3F1E9"/>
    <text x="39" y="116.5" font-size="10" font-weight="600" fill="#57554E" text-anchor="middle">1</text>
    <text x="104" y="134" font-size="12.5" font-weight="600" fill="#3D3D3A" text-anchor="middle">session-start hook</text>
    <text x="104" y="146" font-size="10" fill="#8A887F" text-anchor="middle">pull · print the board</text>
  </g>
  <line x1="185" y1="126" x2="197" y2="126" stroke="#8A887F" stroke-width="1.3" marker-end="url(#tip)"/>
  <g class="card">
    <rect x="201" y="98" width="161" height="56" rx="10" fill="#FFFFFF" stroke="#E5E2D9"/>
    <circle cx="216" cy="113" r="8.5" fill="#F3F1E9"/>
    <text x="216" y="116.5" font-size="10" font-weight="600" fill="#57554E" text-anchor="middle">2</text>
    <text x="281" y="134" font-size="12.5" font-weight="600" fill="#3D3D3A" text-anchor="middle">DASHBOARD</text>
    <text x="281" y="146" font-size="10" fill="#8A887F" text-anchor="middle">the state surface</text>
  </g>
  <line x1="362" y1="126" x2="374" y2="126" stroke="#8A887F" stroke-width="1.3" marker-end="url(#tip)"/>
  <g class="card">
    <rect x="378" y="98" width="161" height="56" rx="10" fill="#FFFFFF" stroke="#E5E2D9"/>
    <circle cx="393" cy="113" r="8.5" fill="#F3F1E9"/>
    <text x="393" y="116.5" font-size="10" font-weight="600" fill="#57554E" text-anchor="middle">3</text>
    <text x="458" y="134" font-size="12.5" font-weight="600" fill="#3D3D3A" text-anchor="middle">LAWS</text>
    <text x="458" y="146" font-size="10" fill="#8A887F" text-anchor="middle">via the CLAUDE.md import</text>
  </g>
  <line x1="539" y1="126" x2="551" y2="126" stroke="#8A887F" stroke-width="1.3" marker-end="url(#tip)"/>
  <g class="card">
    <rect x="555" y="98" width="161" height="56" rx="10" fill="#FFFFFF" stroke="#E5E2D9"/>
    <circle cx="570" cy="113" r="8.5" fill="#F3F1E9"/>
    <text x="570" y="116.5" font-size="10" font-weight="600" fill="#57554E" text-anchor="middle">4</text>
    <text x="635" y="134" font-size="12.5" font-weight="600" fill="#3D3D3A" text-anchor="middle">the active memory</text>
    <text x="635" y="146" font-size="10" fill="#8A887F" text-anchor="middle">the story so far</text>
  </g>

  <path d="M370 154 L370 178" fill="none" stroke="#B3B0A5" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#tipd)"/>

  <text x="28" y="196" font-size="9" font-weight="600" letter-spacing="0.8" fill="#B3B0A5">THE WRITES — EACH CARD SITS IN THE SURFACE IT WRITES</text>

  <rect class="lane" x="24" y="206" width="200" height="272" rx="10" fill="#F2F1FB" opacity="0.55"/>
  <rect class="lane" x="224" y="206" width="140" height="272" rx="10" fill="#F1EFE6" opacity="0.6"/>
  <rect class="lane" x="364" y="206" width="196" height="272" rx="10" fill="#F1EFE6" opacity="0.6"/>
  <rect class="lane" x="560" y="206" width="156" height="272" rx="10" fill="#FCF4E4" opacity="0.55"/>

  <g font-size="11" font-weight="600" letter-spacing="1" text-anchor="middle">
    <text x="124" y="226" fill="#534AB7">DASHBOARD</text>
    <text x="294" y="226" fill="#57554E">ROADMAP</text>
    <text x="462" y="226" fill="#57554E">record/</text>
    <text x="638" y="226" fill="#854F0B">IDEAS</text>
  </g>
  <rect x="94" y="232" width="60" height="3" rx="1.5" fill="#7F77DD"/>
  <rect x="264" y="232" width="60" height="3" rx="1.5" fill="#B3B0A5"/>
  <rect x="432" y="232" width="60" height="3" rx="1.5" fill="#B3B0A5"/>
  <rect x="608" y="232" width="60" height="3" rx="1.5" fill="#EF9F27"/>

  <g class="card">
    <rect x="38" y="248" width="172" height="48" rx="10" fill="#FFFFFF" stroke="#E5E2D9"/>
    <circle cx="54" cy="272" r="8.5" fill="#EEEDFE"/>
    <text x="54" y="275.5" font-size="10" font-weight="600" fill="#534AB7" text-anchor="middle">5</text>
    <text x="70" y="269" font-size="12.5" font-weight="600" fill="#3D3D3A">pickup</text>
    <text x="70" y="284" font-size="10" fill="#8A887F">stale repaint</text>
  </g>
  <g class="card">
    <rect x="38" y="306" width="172" height="48" rx="10" fill="#FFFFFF" stroke="#E5E2D9"/>
    <circle cx="54" cy="330" r="8.5" fill="#EEEDFE"/>
    <text x="54" y="333.5" font-size="10" font-weight="600" fill="#534AB7" text-anchor="middle">6</text>
    <text x="70" y="327" font-size="12.5" font-weight="600" fill="#3D3D3A">handoff</text>
    <text x="70" y="342" font-size="10" fill="#8A887F">rewrites, repaint, note</text>
  </g>
  <g class="card">
    <rect x="38" y="364" width="172" height="48" rx="10" fill="#FFFFFF" stroke="#E5E2D9"/>
    <circle cx="54" cy="388" r="8.5" fill="#EEEDFE"/>
    <text x="54" y="391.5" font-size="10" font-weight="600" fill="#534AB7" text-anchor="middle">7</text>
    <text x="70" y="385" font-size="12.5" font-weight="600" fill="#3D3D3A">liftoff</text>
    <text x="70" y="400" font-size="10" fill="#8A887F">flight-plan repaint</text>
  </g>
  <g class="card">
    <rect x="38" y="422" width="172" height="48" rx="10" fill="#FFFFFF" stroke="#E5E2D9"/>
    <circle cx="54" cy="446" r="8.5" fill="#EEEDFE"/>
    <text x="54" y="449.5" font-size="10" font-weight="600" fill="#534AB7" text-anchor="middle">8</text>
    <text x="70" y="443" font-size="12.5" font-weight="600" fill="#3D3D3A">ship</text>
    <text x="70" y="458" font-size="10" fill="#8A887F">weld + tail repaint</text>
  </g>

  <g class="card">
    <rect x="238" y="248" width="112" height="48" rx="10" fill="#FFFFFF" stroke="#E5E2D9"/>
    <circle cx="254" cy="272" r="8.5" fill="#EEEDFE"/>
    <text x="254" y="275.5" font-size="10" font-weight="600" fill="#534AB7" text-anchor="middle">9</text>
    <text x="270" y="269" font-size="12.5" font-weight="600" fill="#3D3D3A">ship</text>
    <text x="270" y="284" font-size="10" fill="#8A887F">the tick</text>
  </g>
  <text x="294" y="312" font-size="9" fill="#B3B0A5" text-anchor="middle">the only stored</text>
  <text x="294" y="323" font-size="9" fill="#B3B0A5" text-anchor="middle">task state</text>

  <g class="card">
    <rect x="378" y="248" width="168" height="48" rx="10" fill="#FFFFFF" stroke="#E5E2D9"/>
    <circle cx="394" cy="272" r="8.5" fill="#EEEDFE"/>
    <text x="394" y="275.5" font-size="10" font-weight="600" fill="#534AB7" text-anchor="middle">10</text>
    <text x="410" y="269" font-size="12.5" font-weight="600" fill="#3D3D3A">ship</text>
    <text x="410" y="284" font-size="10" fill="#8A887F">memory + ledger</text>
  </g>
  <g class="card">
    <rect x="378" y="306" width="168" height="48" rx="10" fill="#FFFFFF" stroke="#E5E2D9"/>
    <circle cx="394" cy="330" r="8.5" fill="#EEEDFE"/>
    <text x="394" y="333.5" font-size="10" font-weight="600" fill="#534AB7" text-anchor="middle">11</text>
    <text x="410" y="327" font-size="12.5" font-weight="600" fill="#3D3D3A">decide</text>
    <text x="410" y="342" font-size="10" fill="#8A887F">entry + ripple</text>
  </g>
  <g class="chip">
    <rect x="392" y="362" width="118" height="18" rx="9" fill="#FFFFFF" stroke="#B3B0A5"/>
    <text x="451" y="374.5" font-size="10" font-family="monospace" fill="#57554E" text-anchor="middle">in the same commit</text>
  </g>
  <text x="462" y="398" font-size="9" fill="#B3B0A5" text-anchor="middle">DECISIONS + every affected file</text>

  <g class="card">
    <rect x="574" y="248" width="128" height="48" rx="10" fill="#FFFFFF" stroke="#E5E2D9"/>
    <circle cx="590" cy="272" r="8.5" fill="#FAEEDA"/>
    <text x="590" y="275.5" font-size="10" font-weight="600" fill="#854F0B" text-anchor="middle">12</text>
    <text x="606" y="269" font-size="12.5" font-weight="600" fill="#3D3D3A">an idea</text>
    <text x="606" y="284" font-size="10" fill="#8A887F">one dated line</text>
  </g>
  <g class="chip">
    <rect x="592" y="306" width="92" height="18" rx="9" fill="#FAEEDA" stroke="#EAD3A2"/>
    <text x="638" y="318.5" font-size="10" font-family="monospace" fill="#854F0B" text-anchor="middle">unasked</text>
  </g>
  <text x="638" y="342" font-size="9" fill="#B3B0A5" text-anchor="middle">or a defect — the only</text>
  <text x="638" y="353" font-size="9" fill="#B3B0A5" text-anchor="middle">inbox in the workshop</text>

  <text x="28" y="500" font-size="9.5" fill="#B3B0A5">Ship appears three times because it writes three surfaces — the lane is the store, and a card is one write into it.</text>
  <text x="28" y="520" font-size="9.5" fill="#B3B0A5">Lane = the surface written · card = one write, titled by its writer · chip = the rule on that crossing · dashed = the machine.</text>
</svg>
